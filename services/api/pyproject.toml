[project]
name = "sentinel-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.32,<1", "sqlalchemy>=2.0,<3", "httpx>=0.28,<1", "python-multipart>=0.0.20", "pydantic>=2.10,<3"]
[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
